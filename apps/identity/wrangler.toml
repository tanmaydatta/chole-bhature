name = "incentives-identity-local"
main = "src/worker.ts"
compatibility_date = "2026-07-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
APP_ENV = "local"
PUBLIC_APP_ORIGIN = "http://localhost:5173"
COOKIE_PREFIX = "incentives-local"
EMAIL_MODE = "local-capture"
MAGIC_LINK_TTL_SECONDS = "300"
EMAIL_RATE_LIMIT_MAX = "3"
EMAIL_RATE_LIMIT_WINDOW_SECONDS = "60"
STAGING_ALLOWED_RECIPIENTS = "[]"
PASSKEY_RP_ID = "localhost"
PASSKEY_RP_NAME = "Incentives Operator (Local)"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "incentives-auth-local"
database_id = "10000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[services]]
binding = "CORE"
service = "incentives-api"
entrypoint = "CoreOperatorService"
