name = "incentives-operator-web-local"
main = "src/worker.ts"
compatibility_date = "2026-07-20"
workers_dev = false
preview_urls = false

[vars]
APP_ENV = "local"
PUBLIC_APP_ORIGIN = "http://localhost:5173"

[dev]
port = 5173

[[services]]
binding = "IDENTITY_AUTH"
service = "incentives-identity-local"

[[services]]
binding = "IDENTITY"
service = "incentives-identity-local"
entrypoint = "IdentityOperatorService"

[[services]]
binding = "CORE"
service = "incentives-api"
entrypoint = "CoreOperatorService"

[assets]
directory = "../dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/auth/*", "/internal/*", "/operator/v1/*"]
