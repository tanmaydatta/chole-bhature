name = "incentives-demo-store"
main = "worker/index.ts"
compatibility_date = "2026-07-18"

routes = [
  { pattern = "demo.wastd.dev", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
DEMO_MODE = "local"
DEMO_CHECKOUT_ENABLED = "true"

# To evaluate against the real incentives API instead of the bundled evaluator:
#
#   [vars]
#   DEMO_MODE = "core"
#   DEMO_CORE_URL = "https://api.example.com"
#   CORE_PUBLISHABLE_KEY = "pk_..."
#
# and store the secret credential out of band:
#
#   pnpm exec wrangler secret put CORE_SECRET_KEY
#
# The secret key must belong to a budget-limited demo merchant. The BFF is
# intentionally unauthenticated: anyone with the demo URL can commit a
# redemption against that merchant.
