[package]
name = "incentives-discount-fn"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
shopify_function = "=2.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
