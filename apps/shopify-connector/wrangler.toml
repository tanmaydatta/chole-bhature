name = "shopify-connector"
main = "src/app.ts"
compatibility_date = "2026-07-18"
workers_dev = false
preview_urls = false

[vars]
APP_ENV = "production"
SHOPIFY_CLIENT_ID = "shopify-test-client-id"
SHOPIFY_CLIENT_SECRET = "shopify-test-client-secret"
SHOPIFY_APP_URL = "https://shopify.incentives.dev"

[[d1_databases]]
binding = "DB"
database_name = "shopify-connector-dev"
database_id = "00000000-0000-0000-0000-000000000000"

[[services]]
binding = "CORE"
service = "incentives-api"
entrypoint = "CoreOperatorService"
