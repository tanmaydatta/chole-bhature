name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - name: Install PTY test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y expect
      - run: pnpm test

  local-e2e:
    # PR synchronize events run on every push; external forks keep baseline verify only.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      E2E_BROWSER_CHANNEL: chromium
      COREPACK_ENABLE_NETWORK: '0'
      pnpm_config_verify_deps_before_run: error
      pnpm_config_enable_global_virtual_store: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium and Linux dependencies
        run: pnpm --filter @incentives/e2e exec playwright install --with-deps chromium
      # Playwright imports built workspace contracts before global setup can start.
      - run: pnpm build
      - name: Run full local stack API and browser suite
        run: pnpm e2e:local
      # No artifact upload: local root sessions, run proofs and request headers are private.
